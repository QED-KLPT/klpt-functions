name: Build and deploy KLPT Functions

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: klpt-functions-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_PATH: klpt-functions/klpt-functions.csproj
  PUBLISH_PATH: ${{ github.workspace }}/publish
  DOTNET_VERSION: 9.0.x

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish deployment package
        run: >
          dotnet publish "${{ env.PROJECT_PATH }}"
          --configuration Release
          --no-restore
          --output "${{ env.PUBLISH_PATH }}"
          /p:UseAppHost=false

      - name: Upload deployment package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: function-app
          path: ${{ env.PUBLISH_PATH }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy-production:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: ${{ env.PUBLISH_PATH }}

      - name: Validate deployment package
        shell: bash
        run: |
          test -d "${{ env.PUBLISH_PATH }}/.azurefunctions"
          test -f "${{ env.PUBLISH_PATH }}/host.json"
          test -f "${{ env.PUBLISH_PATH }}/functions.metadata"

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: klpt-functions
          package: ${{ env.PUBLISH_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption

  deploy-development:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    needs: build
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: function-app
          path: ${{ env.PUBLISH_PATH }}

      - name: Validate deployment package
        shell: bash
        run: |
          test -d "${{ env.PUBLISH_PATH }}/.azurefunctions"
          test -f "${{ env.PUBLISH_PATH }}/host.json"
          test -f "${{ env.PUBLISH_PATH }}/functions.metadata"

      - name: Deploy to Azure Functions development
        uses: Azure/functions-action@v1
        with:
          app-name: klpt-functions-dev
          package: ${{ env.PUBLISH_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_DEV }}
          sku: flexconsumption
